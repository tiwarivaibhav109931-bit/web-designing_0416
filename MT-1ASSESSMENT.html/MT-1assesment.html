<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Player</title>
</head>
<body>

    
    <p><strong>3. Audio and Video </strong></p>
    <p>Create an audio file (song.mp3) and a video file (college.mp4) with proper headings and controls.</p>
    
    <hr>

    
    <h1>Multimedia Player</h1>

    
    <h2>Audio Section</h2>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    
    <h2>Video Section</h2>
    <video width="320" height="180" controls>
        <source src="college.mp4" type="video/mp4">
        Your browser does not support the video element.
    </video>

</body>
</html>
