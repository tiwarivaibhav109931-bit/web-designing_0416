<!DOCTYPE html>
<html>
<head>
    <title>ABC College Admission 2026</title>
</head>
<body>

    <!-- Header -->
    <table width="100%" bgcolor="#1a237e" cellpadding="15">
        <tr>
            <td align="center">
                <font color="white" size="5"><b>ABC College   Admission 2026</b></font>
            </td>
        </tr>
    </table>

    <br>

    <!-- Main Content Section -->
    <h2>Courses and Fees</h2>
    <p align="center">Available Courses</p>

    <!-- Table -->
    <table border="1" width="100%" cellspacing="0" cellpadding="8">
        <thead>
            <tr bgcolor="#e8eaf6">
                <th align="center">Course</th>
                <th align="center">Seats</th>
                <th align="center">Fees</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </tbody>
    </table>

    <br><br>
    <form>
        <fieldset>
            <legend>Application Form</legend>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="course_select">Course:</label><br>
            <select id="course_select" name="course">
                <option value="btech_cse" selected>B.Tech CSE</option>
                <option value="bca">BCA</option>
            </select>
            <br><br>

            <label for="statement">Statement:</label><br>
            <textarea id="statement" name="statement" rows="5" cols="50"></textarea>
            <br><br>

            <input type="submit" value="Apply">

        </fieldset>
    </form>

    <br><br>

    <table width="100%" bgcolor="#1a237e" cellpadding="10">
        <tr>
            <td align="center">
                <font color="white">&copy; 2026 ABC College</font>
            </td>
        </tr>
    </table>

</body>
</html>
